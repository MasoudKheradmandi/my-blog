baseURL = "https://masoudkheradmandi.ir/"
defaultContentLanguage = 'fa'
title = "Masoud Kheradmandi"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "go.ngs.io/hugo-primer-blog"

[params]
  sidebar = true
  recentPostsCount = 5
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  showReadingTime = true
  showAuthor = true
  showShareButtons = true
  author = "امیرمسعود خردمندی"
  description = "وبلاگ امیرمسعود خردمندی؛ مطالبی درباره Python، Django، FastAPI، Backend و توسعه نرم‌افزار."

  [[params.sidebarModules]]
    partial = "tags"
  
  [[params.sidebarModules]]
    partial = "categories"
  
  [params.social]
    github = "MasoudKheradmandi"

[[menus.main]]
  name = "MyCv"
  url = "/posts/masoudkheradmandi/cv/"
  weight = 4

[[menus.main]]
  name = "Posts"
  url = "/posts/"
  weight = 3
[[menus.main]]
  name = "categories"
  url = "/categories/"
  weight = 2

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[related]
threshold = 60
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "keywords"
weight = 80

[[related.indices]]
name = "date"
weight = 10
pattern = "2006"


faviconIco = "favicon.ico"

