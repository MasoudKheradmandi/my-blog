baseURL = "http://masoudkehradmandi.ir/"
languageCode = "en"
title = "My Blog"

[module]
  [[module.imports]]
    path = "go.ngs.io/hugo-primer-blog"

[params]
  sidebar = true
  recentPostsCount = 5
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  showReadingTime = true
  showAuthor = true
  showShareButtons = true


[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1